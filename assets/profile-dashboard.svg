<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kartik Bhalodiya engineering profile dashboard</title>
  <desc id="desc">A polished dark engineering dashboard banner for a GitHub profile.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050B16"/>
      <stop offset="0.46" stop-color="#0A1324"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="90" y1="338" x2="1110" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.38" stop-color="#34D399"/>
      <stop offset="0.7" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111C2E"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <style>
      .eyebrow { fill: #7DD3FC; font: 700 15px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 3px; }
      .title { fill: #F8FAFC; font: 850 64px Inter, Segoe UI, Arial, sans-serif; }
      .sub { fill: #B6C6D9; font: 520 22px Inter, Segoe UI, Arial, sans-serif; }
      .small { fill: #8EA4BF; font: 600 15px Inter, Segoe UI, Arial, sans-serif; }
      .tiny { fill: #7F93AD; font: 600 12px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 1.4px; }
      .code { fill: #BEEBFF; font: 500 16px Consolas, Menlo, monospace; }
      .codeDim { fill: #6E829D; font: 500 16px Consolas, Menlo, monospace; }
      .metric { fill: #FFFFFF; font: 850 32px Inter, Segoe UI, Arial, sans-serif; }
      .metricName { fill: #A8B8CC; font: 700 13px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 1.7px; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#page)"/>
  <path d="M0 78H1200M0 154H1200M0 230H1200M0 306H1200M132 0V420M312 0V420M492 0V420M672 0V420M852 0V420M1032 0V420" stroke="#29405D" stroke-opacity="0.38"/>
  <path d="M72 340C178 270 267 304 365 238C475 164 552 90 681 128C801 164 855 294 981 226C1041 194 1078 125 1127 82" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
  <path d="M72 340C178 270 267 304 365 238C475 164 552 90 681 128C801 164 855 294 981 226C1041 194 1078 125 1127 82" stroke="#FFFFFF" stroke-width="15" stroke-opacity="0.06" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="64" y="58" width="560" height="244" rx="26" fill="url(#card)" stroke="#2E4A68"/>
    <text x="102" y="106" class="eyebrow">ENGINEERING PROFILE</text>
    <text x="100" y="176" class="title">Kartik Bhalodiya</text>
    <text x="104" y="222" class="sub">Full-stack developer building useful dashboards,</text>
    <text x="104" y="254" class="sub">AI tooling, automation, and deployable products.</text>
    <rect x="104" y="278" width="150" height="36" rx="18" fill="#0D9488" fill-opacity="0.18" stroke="#2DD4BF" stroke-opacity="0.7"/>
    <text x="128" y="301" class="small" fill="#CCFBF1">BUILD MODE</text>
    <rect x="272" y="278" width="170" height="36" rx="18" fill="#2563EB" fill-opacity="0.16" stroke="#60A5FA" stroke-opacity="0.65"/>
    <text x="297" y="301" class="small" fill="#DBEAFE">SHIP FOCUSED</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="684" y="58" width="452" height="158" rx="24" fill="#091426" stroke="#2E4A68"/>
    <rect x="684" y="58" width="452" height="42" rx="24" fill="#101F35"/>
    <circle cx="716" cy="79" r="6" fill="#EF4444"/>
    <circle cx="738" cy="79" r="6" fill="#FBBF24"/>
    <circle cx="760" cy="79" r="6" fill="#22C55E"/>
    <text x="707" y="127" class="codeDim">$</text>
    <text x="732" y="127" class="code">build --from idea --to release</text>
    <text x="707" y="158" class="codeDim">$</text>
    <text x="732" y="158" class="code">focus: web apps | ai tools | automation</text>
    <text x="707" y="189" class="codeDim">$</text>
    <text x="732" y="189" class="code">status: learning, shipping, improving</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="684" y="242" width="136" height="94" rx="20" fill="url(#card)" stroke="#2E4A68"/>
    <text x="710" y="285" class="metric">UX</text>
    <text x="710" y="314" class="metricName">INTERFACES</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="842" y="242" width="136" height="94" rx="20" fill="url(#card)" stroke="#2E4A68"/>
    <text x="868" y="285" class="metric">API</text>
    <text x="868" y="314" class="metricName">BACKENDS</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1000" y="242" width="136" height="94" rx="20" fill="url(#card)" stroke="#2E4A68"/>
    <text x="1026" y="285" class="metric">AI</text>
    <text x="1026" y="314" class="metricName">TOOLING</text>
  </g>

  <rect x="64" y="346" width="1072" height="36" rx="18" fill="#E2E8F0" fill-opacity="0.06" stroke="#334155" stroke-opacity="0.9"/>
  <rect x="86" y="359" width="190" height="10" rx="5" fill="#22D3EE"/>
  <rect x="296" y="359" width="260" height="10" rx="5" fill="#34D399"/>
  <rect x="576" y="359" width="220" height="10" rx="5" fill="#FBBF24"/>
  <rect x="816" y="359" width="298" height="10" rx="5" fill="#A78BFA"/>
  <text x="86" y="404" class="tiny">PLAN</text>
  <text x="296" y="404" class="tiny">BUILD</text>
  <text x="576" y="404" class="tiny">TEST</text>
  <text x="816" y="404" class="tiny">SHIP</text>
</svg>
